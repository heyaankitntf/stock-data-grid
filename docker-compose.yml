# docker-compose.yml — convenience wrapper for local development.
#
# IMPORTANT: Use `docker compose` V2 (the Go plugin, with a SPACE), NOT
# `docker-compose` V1 (the Python tool, with a HYPHEN). V1 (1.29.2) is EOL
# since May 2023 and has a known bug where recreating a container that was
# originally created by Docker Engine 25+ crashes with:
#
#   ERROR: for scanner  'ContainerConfig'
#   KeyError: 'ContainerConfig'
#
# This is because modern Docker Engine no longer includes the `ContainerConfig`
# key in image inspect metadata, and V1 looks for it. V2 is the supported
# replacement and ships with Docker Engine 20.10+ as a CLI plugin.
#
# Check your version:
#   docker compose version       # V2 — RECOMMENDED
#   docker-compose version       # V1 — AVOID (will hit KeyError)
#
# Usage (V2):
#   docker compose up            # foreground
#   docker compose up -d         # detached
#   docker compose down          # stop + remove container
#   docker compose down -v       # also wipe the data volume
#   docker compose up -d --build # rebuild image then start
#
# If you're stuck on V1 and hit the KeyError, the workaround is to remove
# the old container first so V1 has nothing to inspect:
#   docker rm -f scanner && docker-compose up -d
#
services:
  scanner:
    build:
      context: ./stock-screener
      dockerfile: Dockerfile
    image: stock-scanner:latest
    container_name: scanner
    ports:
      - "8501:8501"
    volumes:
      - scanner-data:/app/data
    environment:
      # Override these in production via a .env file or shell export.
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  scanner-data:
    driver: local
