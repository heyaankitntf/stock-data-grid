# ──────────────────────────────────────────────────────────────────────────────
# Streamlit configuration.
#
# NOTE ON THEMING / FOUC:
#   The app's dark/light palettes are defined in app/styles/palettes.py and
#   injected at runtime via app/styles/bootstrap.py (critical CSS) and
#   app/styles/css.py (decorative CSS). We deliberately do NOT set a
#   [theme] block here, because:
#     1. Streamlit's native [theme] only supports ONE palette (no dark/light
#        toggle), but this app supports user-toggled themes.
#     2. The critical bootstrap CSS in app/styles/bootstrap.py runs before
#        any [theme] would apply, and pre-paints the correct palette via
#        CSS variables + inline JS that reads the theme cookie synchronously.
#   So the [theme] block is intentionally absent.
# ──────────────────────────────────────────────────────────────────────────────

[runner]
fastReruns = true
enforceSerializableSessionState = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[ui]
hideTopBar = false

[server]
runOnSave = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
