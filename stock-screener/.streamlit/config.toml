# ──────────────────────────────────────────────────────────────────────────────
# Streamlit configuration.
#
# NOTE ON THEMING / FOUC:
#   The app's dark/light palettes are defined in app/styles/palettes.py and
#   injected at runtime via app/styles/bootstrap.py (critical CSS) and
#   app/styles/css.py (decorative CSS).
#
#   We force base = "dark" here so that Streamlit's native theme engine
#   always starts in dark mode, regardless of the OS/browser preference.
#   This prevents the light-mode flash when the system theme is light.
#   The app's custom theme toggle (dark/light) in the sidebar then
#   overrides the visual palette via CSS variables.
# ──────────────────────────────────────────────────────────────────────────────

[theme]
base = "dark"
primaryColor = "#00d4aa"
backgroundColor = "#0b1622"
secondaryBackgroundColor = "#0f2030"
textColor = "#d0e0f0"

[runner]
fastReruns = true
enforceSerializableSessionState = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[ui]
hideTopBar = false

[server]
runOnSave = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
