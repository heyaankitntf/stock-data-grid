[server]
headless = true
address = "0.0.0.0"
port = 8099
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
# These values MUST match PALETTES["dark"] in app.py.
# Streamlit renders this theme *before* our Python-side inject_css() runs,
# so if these don't match the custom palette, the user sees a color flash
# (FOUC) on every refresh. Keeping them in sync eliminates the flash.
base = "dark"
backgroundColor = "#0b1622"
secondaryBackgroundColor = "#0f2030"
primaryColor = "#00d4aa"
textColor = "#d0e0f0"
